version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - revive
    - bodyclose
    - errorlint
    - noctx
    - sloglint
  settings:
    sloglint:
      no-global: all
      context: scope

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mansonxasthur/eshaar
