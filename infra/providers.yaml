# Providers per channel, in order of priority: priority 1 is tried first and
# each higher number takes over when the one before it fails, is rate limited or
# times out. The order in this file does not matter; priority does, and it is
# unique within a channel. Priorities can be changed from the environment to
# reorder a channel without editing the file. Every channel and provider has
# its own rate limit, call timeout and circuit breaker.
#
# Values come from the environment through placeholders: a dollar sign, a
# brace, the variable name and a closing brace. With no default the variable
# must be set; adding colon, dash and a value after the name gives it a default.
# Placeholders are expanded everywhere in this file, even in comments, so none
# are spelled out here.
#
# kind selects the adapter; only the mock exists so far. rps is outbound calls
# per second to that provider on that channel. timeout limits one call to it.
# breaker.failures consecutive transient errors or timeouts open it for
# breaker.open_for, after which one probe call decides whether it closes.
#
# mock (mock kind only) makes a provider slow or flaky for the load test:
# latency is how long every call takes (above timeout it always times out) and
# error_rate is the share of calls, 0 to 1, that fail with a transient error.
# The defaults answer at once and never fail.
#
# webhook_secret is the key the provider signs its webhooks with (at least 16
# characters of letters, digits and . _ + -). Only the webhook process reads it,
# and a provider with an empty one cannot deliver webhooks. It is empty here so
# the sender starts without it; set it in the environment.
sms:
  - name: sms-a
    kind: mock
    priority: ${SMS_A_PRIORITY:-1}
    rps: ${SMS_A_RPS:-1000}
    timeout: ${SMS_A_TIMEOUT:-2s}
    breaker: {failures: 5, open_for: 30s}
    mock: {latency: ${SMS_A_LATENCY:-0s}, error_rate: ${SMS_A_ERROR_RATE:-0}}
    webhook_secret: "${SMS_A_WEBHOOK_SECRET:-}"
  - name: sms-b
    kind: mock
    priority: ${SMS_B_PRIORITY:-2}
    rps: ${SMS_B_RPS:-1000}
    timeout: ${SMS_B_TIMEOUT:-2s}
    breaker: {failures: 5, open_for: 30s}
    mock: {latency: ${SMS_B_LATENCY:-0s}, error_rate: ${SMS_B_ERROR_RATE:-0}}
    webhook_secret: "${SMS_B_WEBHOOK_SECRET:-}"
