# Local environment: Postgres and a single-node Kafka (KRaft, no ZooKeeper).
# Start with `make up`. Host ports: Postgres 5432, Kafka 9092.
#
# The `stack` profile (`make stack-up`) adds the five Eshaar processes for the
# load test: dispatcher on host port 8080, webhook on 8081. Tune the run with
# the variables below (rate limit, pool size, provider latency and error rate)
# from the shell or an .env file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eshaar
      POSTGRES_PASSWORD: eshaar
      POSTGRES_DB: eshaar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eshaar -d eshaar"]
      interval: 2s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      # INTERNAL is for containers on the compose network, EXTERNAL for the host.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the notifications topic once Kafka is healthy, then exits.
  # Messages are keyed by idempotency_key, so partitions spread evenly.
  # --if-not-exists keeps an existing topic as is: changing KAFKA_PARTITIONS
  # needs `make down COMPOSE_DOWN_FLAGS=-v` first.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:19092
      - --create
      - --if-not-exists
      - --topic
      - ${KAFKA_TOPIC:-notifications}
      - --partitions
      - ${KAFKA_PARTITIONS:-12}
      - --replication-factor
      - "1"

  # Eshaar processes, started only with the `stack` profile.
  migrate:
    profiles: [stack]
    image: eshaar:local
    build: {context: .., dockerfile: infra/Dockerfile}
    command: [migrate]
    environment: &db
      DATABASE_URL: postgres://eshaar:eshaar@postgres:5432/eshaar?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  dispatcher:
    profiles: [stack]
    image: eshaar:local
    command: [dispatcher]
    ports: ["127.0.0.1:8080:8080"]
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-notifications}
      HTTP_ADDR: ":8080"
      DISPATCHER_API_KEYS: ${DISPATCHER_API_KEYS:-loadtest-1,loadtest-2,loadtest-3,loadtest-4}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-1000000}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-1000000}
    depends_on:
      migrate: {condition: service_completed_successfully} # builds the shared image first
      kafka-init: {condition: service_completed_successfully}

  sender:
    profiles: [stack]
    image: eshaar:local
    command: [sender]
    environment: &providers
      <<: *db
      KAFKA_BROKERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-notifications}
      PROVIDERS_CONFIG: /etc/eshaar/providers.yaml
      SENDER_POOL_SIZE: ${SENDER_POOL_SIZE:-256}
      SENDER_BATCH_SIZE: ${SENDER_BATCH_SIZE:-500}
      SMS_A_LATENCY: ${SMS_A_LATENCY:-0s}
      SMS_A_ERROR_RATE: ${SMS_A_ERROR_RATE:-0}
      SMS_B_LATENCY: ${SMS_B_LATENCY:-0s}
      SMS_B_ERROR_RATE: ${SMS_B_ERROR_RATE:-0}
      SMS_A_RPS: ${PROVIDER_RPS:-100000}
      SMS_B_RPS: ${PROVIDER_RPS:-100000}
      EMAIL_A_RPS: ${PROVIDER_RPS:-100000}
      EMAIL_B_RPS: ${PROVIDER_RPS:-100000}
      WHATSAPP_A_RPS: ${PROVIDER_RPS:-100000}
      WHATSAPP_B_RPS: ${PROVIDER_RPS:-100000}
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}

  webhook:
    profiles: [stack]
    image: eshaar:local
    command: [webhook]
    ports: ["127.0.0.1:8081:8080"]
    environment:
      <<: *providers
      HTTP_ADDR: ":8080"
      SMS_A_WEBHOOK_SECRET: loadtest-secret-sms-a
      SMS_B_WEBHOOK_SECRET: loadtest-secret-sms-b
      EMAIL_A_WEBHOOK_SECRET: loadtest-secret-email-a
      EMAIL_B_WEBHOOK_SECRET: loadtest-secret-email-b
      WHATSAPP_A_WEBHOOK_SECRET: loadtest-secret-wa-a
      WHATSAPP_B_WEBHOOK_SECRET: loadtest-secret-wa-b
    depends_on:
      migrate: {condition: service_completed_successfully}

  janitor:
    profiles: [stack]
    image: eshaar:local
    command: [janitor]
    environment: *providers
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  postgres-data:
  kafka-data:
